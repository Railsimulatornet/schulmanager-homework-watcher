version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
    # Playwright und Browser-Image müssen gemeinsam aktualisiert werden.
    # Nur Versionsupdates ausnehmen; Sicherheitsupdates bleiben aktiv.
    ignore:
      - dependency-name: playwright
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-patch:
        update-types:
          - patch
      actions-minor:
        update-types:
          - minor
