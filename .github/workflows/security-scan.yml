name: Container security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --pull --no-cache --tag schulmanager-homework-watcher:ci .

      - name: Scan image with Trivy
        run: |
          set -euo pipefail
          mkdir -p trivy-results

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-results:/out" \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:latest \
            image \
            --image-src docker \
            --scanners vuln \
            --pkg-types os,library \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /out/trivy.sarif \
            schulmanager-homework-watcher:ci

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-results:/out" \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:latest \
            image \
            --image-src docker \
            --scanners vuln \
            --pkg-types os,library \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --output /out/trivy.txt \
            schulmanager-homework-watcher:ci

      - name: Dependency compatibility smoke test
        shell: bash
        run: |
          set -euo pipefail

          echo "=== JavaScript syntax ==="
          docker run --rm \
            --entrypoint /bin/sh \
            schulmanager-homework-watcher:ci \
            -ec 'find /app/src -type f -name "*.js" -print -exec node --check {} \;'

          echo
          echo "=== Dependency/API compatibility ==="
          docker run --rm \
            -v "$PWD/.github/scripts/dependency-smoke-test.js:/app/.dependency-smoke-test.js:ro" \
            --entrypoint node \
            schulmanager-homework-watcher:ci \
            /app/.dependency-smoke-test.js

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-results/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-results/trivy.sarif

      - name: Upload Trivy report
        if: always() && hashFiles('trivy-results/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results/


      - name: Set up QEMU for weekly latest refresh
        if: github.event_name == 'schedule'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx for weekly latest refresh
        if: github.event_name == 'schedule'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub for weekly latest refresh
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refresh weekly latest image
        if: github.event_name == 'schedule'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: railsimulatornet/schulmanager-homework-watcher:latest
          labels: |
            org.opencontainers.image.version=weekly-latest
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
