name: Container security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check publication helpers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck skopeo
          for script in .github/scripts/*.sh; do bash -n "$script"; done
          shellcheck --severity=warning .github/scripts/*.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          mkdir -p "$RUNNER_TEMP/schulmanager"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build candidate archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: false
          tags: schulmanager-homework-watcher:ci
          outputs: type=oci,dest=${{ runner.temp }}/schulmanager/image.tar
          labels: |
            org.opencontainers.image.version=weekly-latest
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Verify both candidate platforms
        run: bash .github/scripts/verify-image.sh "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results"

      - name: Upload AMD64 Trivy SARIF to GitHub Security
        if: ${{ always() && hashFiles('trivy-results/amd64/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: trivy-results/amd64/trivy.sarif
          category: schulmanager-amd64

      - name: Upload ARM64 Trivy SARIF to GitHub Security
        if: ${{ always() && hashFiles('trivy-results/arm64/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: trivy-results/arm64/trivy.sarif
          category: schulmanager-arm64

      - name: Upload Trivy reports
        if: always() && hashFiles('trivy-results/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results/

      - name: Refresh weekly latest image
        if: github.event_name == 'schedule'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          bash .github/scripts/publish-image.sh \
            "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results/verified.sha256" \
            railsimulatornet/schulmanager-homework-watcher:latest
