name: Manual Docker image recovery publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v2.0.3"
        required: true
        type: string

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: railsimulatornet/schulmanager-homework-watcher

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test watcher source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Set build variables
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != *$'\n'* && "$INPUT_VERSION" != *$'\r'* ]]
          echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_ENV"
          echo "DATE_TAG=$(date -u +'%d%m%Y')" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
            type=raw,value=${{ env.DATE_TAG }}

      - name: Show generated tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$TAGS"

      - name: Check publication helpers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck skopeo
          for script in .github/scripts/*.sh; do bash -n "$script"; done
          shellcheck --severity=warning .github/scripts/*.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          mkdir -p "$RUNNER_TEMP/schulmanager"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build recovery candidate archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: false
          tags: schulmanager-homework-watcher:recovery-candidate
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/schulmanager/image.tar
          provenance: mode=max
          sbom: true

      - name: Upload candidate archive
        uses: actions/upload-artifact@v7
        with:
          name: image-candidate
          path: ${{ runner.temp }}/schulmanager/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Download candidate archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-candidate
          path: ${{ runner.temp }}/schulmanager

      - name: Verify candidate on its native architecture
        run: bash .github/scripts/verify-image.sh "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results" "${{ matrix.arch }}"

      - name: Upload Trivy reports
        if: always() && hashFiles('trivy-results/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ matrix.arch }}
          path: trivy-results/${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Download candidate archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-candidate
          path: ${{ runner.temp }}/schulmanager

      - name: Download AMD64 verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-results-amd64
          path: trivy-results/amd64

      - name: Download ARM64 verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-results-arm64
          path: trivy-results/arm64

      - name: Require both platform receipts for this archive
        run: bash .github/scripts/finalize-verification.sh "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results"

      - name: Publish verified Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          bash .github/scripts/publish-image.sh \
            "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results/verified.sha256" "$TAGS"
