name: Manual Docker image recovery publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v2.0.3"
        required: true
        type: string

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: railsimulatornet/schulmanager-homework-watcher

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build recovery candidate
        run: |
          docker build \
            --pull \
            --no-cache \
            --tag schulmanager-homework-watcher:recovery-candidate \
            .

      - name: Security gate with Trivy
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:latest \
            image \
            --image-src docker \
            --scanners vuln \
            --pkg-types os,library \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            schulmanager-homework-watcher:recovery-candidate

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set build variables
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DATE_TAG=$(date -u +'%d%m%Y')" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
            type=raw,value=${{ env.DATE_TAG }}

      - name: Show generated tags
        run: printf '%s\n' "${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
