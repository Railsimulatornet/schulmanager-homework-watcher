name: Create GitHub release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

env:
  DOCKERHUB_IMAGE: railsimulatornet/schulmanager-homework-watcher

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          DATE_TAG="$(date -u +'%d%m%Y')"
          MINOR="${VERSION%.*}"
          TITLE="$(tr -d '\r\n' < .github/release-title.txt)"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: ${VERSION}" >&2
            exit 1
          fi

          if [[ "${TITLE}" != "${TAG}"* ]]; then
            echo "Release title must start with ${TAG}." >&2
            exit 1
          fi

          if ! grep -Fq "${VERSION}" .github/release-notes.md; then
            echo "Release notes do not mention version ${VERSION}." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            EXISTS=true
            echo "Tag ${TAG} already exists. Release creation will be skipped."
          else
            EXISTS=false
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "minor=${MINOR}"
            echo "date_tag=${DATE_TAG}"
            echo "title=${TITLE}"
            echo "exists=${EXISTS}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release candidate
        if: steps.release.outputs.exists != 'true'
        run: |
          docker build \
            --pull \
            --no-cache \
            --tag schulmanager-homework-watcher:release-candidate \
            .

      - name: Security gate with Trivy
        if: steps.release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:latest \
            image \
            --image-src docker \
            --scanners vuln \
            --pkg-types os,library \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            schulmanager-homework-watcher:release-candidate

      - name: Set up QEMU
        if: steps.release.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.release.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.release.outputs.exists != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch Docker image
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.minor }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.date_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Prepare release assets
        if: steps.release.outputs.exists != 'true'
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${RUNNER_TEMP}/schulmanager-homework-watcher_v${{ steps.release.outputs.version }}.zip"
          PDF="${RUNNER_TEMP}/Schulmanager-Homework-Watcher_Handbuch_DE.pdf"

          git archive \
            --format=zip \
            --output="${ZIP}" \
            "${GITHUB_SHA}"

          cp \
            docs/Schulmanager-Homework-Watcher_Handbuch_DE_v1.0.pdf \
            "${PDF}"

          {
            echo "zip=${ZIP}"
            echo "pdf=${PDF}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${{ steps.release.outputs.tag }}" \
            "${{ steps.assets.outputs.zip }}" \
            "${{ steps.assets.outputs.pdf }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.release.outputs.title }}" \
            --notes-file .github/release-notes.md
