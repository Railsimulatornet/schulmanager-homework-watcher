name: Create GitHub release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

env:
  DOCKERHUB_IMAGE: railsimulatornet/schulmanager-homework-watcher

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      minor: ${{ steps.release.outputs.minor }}
      date_tag: ${{ steps.release.outputs.date_tag }}
      title: ${{ steps.release.outputs.title }}
      exists: ${{ steps.release.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          DATE_TAG="$(date -u +'%d%m%Y')"
          MINOR="${VERSION%.*}"
          TITLE="$(tr -d '\r\n' < .github/release-title.txt)"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: ${VERSION}" >&2
            exit 1
          fi

          if [[ "${TITLE}" != "${TAG}"* ]]; then
            echo "Release title must start with ${TAG}." >&2
            exit 1
          fi

          if ! grep -Fq "${VERSION}" .github/release-notes.md; then
            echo "Release notes do not mention version ${VERSION}." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            EXISTS=true
            echo "Tag ${TAG} already exists. Release creation will be skipped."
          else
            rc=$?
            [[ "$rc" -eq 2 ]] || exit "$rc"
            EXISTS=false
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "minor=${MINOR}"
            echo "date_tag=${DATE_TAG}"
            echo "title=${TITLE}"
            echo "exists=${EXISTS}"
          } >> "$GITHUB_OUTPUT"

      - name: Check publication helpers
        if: steps.release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck skopeo
          for script in .github/scripts/*.sh; do bash -n "$script"; done
          shellcheck --severity=warning .github/scripts/*.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          mkdir -p "$RUNNER_TEMP/schulmanager"

      - name: Set up QEMU
        if: steps.release.outputs.exists != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.release.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build release candidate archive
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: false
          tags: schulmanager-homework-watcher:release-candidate
          outputs: type=oci,dest=${{ runner.temp }}/schulmanager/image.tar
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Upload candidate archive
        if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-candidate
          path: ${{ runner.temp }}/schulmanager/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    needs: build
    if: needs.build.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Download candidate archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-candidate
          path: ${{ runner.temp }}/schulmanager

      - name: Verify candidate on its native architecture
        run: bash .github/scripts/verify-image.sh "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results" "${{ matrix.arch }}"

      - name: Upload Trivy reports
        if: always() && hashFiles('trivy-results/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ matrix.arch }}
          path: trivy-results/${{ matrix.arch }}/
          if-no-files-found: error

  release:
    needs: [build, verify]
    if: needs.build.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Download candidate archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-candidate
          path: ${{ runner.temp }}/schulmanager

      - name: Download AMD64 verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-results-amd64
          path: trivy-results/amd64

      - name: Download ARM64 verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-results-arm64
          path: trivy-results/arm64

      - name: Require both platform receipts for this archive
        run: bash .github/scripts/finalize-verification.sh "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results"

      - name: Publish verified multi-arch Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAGS: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.build.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.build.outputs.minor }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.build.outputs.date_tag }}
        run: |
          bash .github/scripts/publish-image.sh \
            "$RUNNER_TEMP/schulmanager/image.tar" "$PWD/trivy-results/verified.sha256" "$TAGS"

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${RUNNER_TEMP}/schulmanager-homework-watcher_v${{ needs.build.outputs.version }}.zip"
          PDF="${RUNNER_TEMP}/Schulmanager-Homework-Watcher_Handbuch_DE.pdf"

          git archive \
            --format=zip \
            --output="${ZIP}" \
            "${GITHUB_SHA}"

          cp \
            docs/Schulmanager-Homework-Watcher_Handbuch_DE_v1.0.pdf \
            "${PDF}"

          {
            echo "zip=${ZIP}"
            echo "pdf=${PDF}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${{ needs.build.outputs.tag }}" \
            "${{ steps.assets.outputs.zip }}" \
            "${{ steps.assets.outputs.pdf }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ needs.build.outputs.title }}" \
            --notes-file .github/release-notes.md
